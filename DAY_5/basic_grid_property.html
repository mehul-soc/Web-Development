<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 200px 200px 200px 200px 200px;
            /* grid-template-columns: 1fr 1fr 1fr 1fr 1fr; */
            /* grid-template-rows: 2fr 2fr 4fr 1fr; */
            /* grid-template-rows: repeat(5, 4fr); */
            height: 1000px;
            gap: 10px;
            
            /* grid-template-columns: minmax(5px, 300px); */
            
        }
        .child{
            border: 1px solid black;
            height: 200px;
            width: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #item5{
            grid-area: 3/3;
        }
        #item4{
            grid-area: 3/1;    
        }
    </style>

</head>

<body>
    <div class="container">
        <div class="child">Box 1</div>
        <div class="child">Box 2</div>
        <div class="child">Box 3</div>
        <div class="child" id="item4">Box 4</div>
        <div class="child" id="item5">Box 5</div>
    </div>
</body>

</html>

<body>
    <h1 style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">Registration Form</h1>
    <div>
        <form action="">
            <label for="">Name</label>
            <input type="text" placeholder="Enter you full name"> <br><br>
            <label for="">Mobile No.</label>
            <input type="number" placeholder=" your mobile number"> <br> <br>
            <label for="">Email ID</label>
            <input type="email" placeholder="Enter your Email address"> <br> <br>
            <label for="">Date Of Birth</label>
            <input type="date"> <br> <br>
            <label for="">Age</label>
            <input type="number" placeholder="Enter your age"> <br> <br>
            <label for="">Gender</label>
            <input type="radio" name="Gender">Male
            <input type="radio" name="Gender">Female
            <input type="radio" name="Gender">Other
            <input type="radio" name="Gender">Prefer not to say <br> <br>
            <label for="">City</label>
            <select name="" id="">
                <option value="">Select an option</option>
                <option value="">Indore</option>
                <option value="">Bhopal</option>
                <option value="">Gwalior</option>
                <option value="">Ujjain</option>
                <option value="">Rewa</option>
                <option value="">Satna</option>
                <option value="">Dewas</option>
                <option value="">Shivpuri</option>
            </select> <br> <br>
            <label for="">Bio</label>
            <textarea name="" rows="3" cols="10"></textarea> <br><br>
            <button type="submit">Submit Details</button>
        </form>
    </div>
</body>
